# CI/CD Pipeline — VaultIQ

# Replaces old Render-deplor-hook workflow with:
# lint -> test -> ARM64 build -> push GHCR -> deploy to EC2 -> flask db upgrade -> health check.

# Fixes from this revision:
#   - GHCR_PAT was documented as a required secret but never actually used
#     anywhere in the deploy script — `docker compose pull` on the VPS would
#     fail on any private package with no auth error explaining why. Added
#     an explicit `docker login ghcr.io` step using GHCR_PAT before the pull.
#   - Added `set -e` to the deploy script — previously only the migration
#     step's exit code was checked; a failed `pull` (e.g. the auth failure
#     above) would have been silently ignored and the script would have
#     carried on to `run --rm backend flask db upgrade` anyway.

# SECRETS NEEDED (repo Settings -> Secrets and variables -> Actions):
#   GHCR_PAT      — PAT with read:packages (write:packages not needed here —
#                   pushing in the `build` job authenticates via GITHUB_TOKEN,
#                   not GHCR_PAT; GHCR_PAT is only for the VPS's pull in `deploy`)
#   VPS_HOST      — EC2 Elastic IP or domain
#   VPS_SSH_KEY   — private key matching the vaultiq-prod-key pair
#   (DATABASE_URL / R2 / OPENROUTER creds live in .env.prod ON the VPS,
#    never as GitHub secrets — the deploy step never touches them directly)

# ONE-TIME VPS PREREQUISITES (not handled by this workflow — do before first run):
#   - docker volume create certbot-etc && docker volume create certbot-webroot
#   - Obtain the first TLS cert via docker-compose.bootstrap.yml (see its
#     header comment) before docker-compose.prod.yml's nginx service can
#     start successfully — it expects a cert to already exist.
#   - /opt/vaultiq/.env.prod must exist on the VPS (see .env.prod.example)

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/sreesyam064/vaultiq-backend
  FRONTEND_IMAGE: ghcr.io/sreesyam064/vaultiq-frontend

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        # E: pycodestyle errors F: pyflakes (unused imports, undefined names)
        # --exclude: ignore frontend (streamlit files have patterns ruff flags)
        run: |
          ruff check backend/ \
            --select E,F \
            --exclude backend/tests/ \
            --ignore E501,E402
        # E501 = line too long (RAG prompts are long, that's fine)
        # E402 = module level import not at top (config patching in tests needs this)

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint
    env:
      # Minimal env vars needed for tests — no real secrets, no real API keys
      # validate_config() checks these at startup; conftest.py sets them too,
      # but setting them here makes environment explicit and auditable.
      SECRET_KEY: "ci-test-secret-key"
      JWT_SECRET_KEY: "ci-test-jwt-secret"
      LLM_PROVIDER: "ollama"
      LLM_MODEL: "qwen2.5:3b"
      LOG_LEVEL: "WARNING"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Tier 1 unit tests
        working-directory: backend
        run: |
          python -m pytest tests/test_unit_config.py tests/test_unit_rag.py \
            tests/test_unit_storage.py tests/test_unit_logging.py -v --tb=short

      - name: Run Tier 3 route tests
        working-directory: backend
        run: |
          python -m pytest tests/test_routes.py -v --tb=short

      # Tier 2 integration tests are intentionally excluded from CI —
      # they require HuggingFace model download and a real Chroma instance.
      # Run locally with: pytest tests/test_integration_rag.py

  build:
    name: Build & push ARM64 images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor}}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          platforms: linux/arm64
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    environment: production # manual approval gate — configure required reviewers in repo Settings -> Environments
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            # Authenticate to GHCR before pulling — GHCR_PAT is docuemnted as needed
            # but was never actually used; without this, `pull` below fails on any private package.

            echo '${{ secrets.GHCR_PAT }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            cd /opt/vaultiq/app
            export IMAGE_TAG=sha-${{ github.sha }}
            docker compose -f docker-compose.prod.yml --env-file ../.env.prod pull
            docker compose -f docker-compose.prod.yml --env-file ../.env.prod run --rm backend flask db upgrade
            docker compose -f docker-compose.prod.yml --env-file ../.env.prod up -d
            sleep 15
            curl -sf https://vault-iq.in/nginx-health || exit 1
            curl -sf https://vault-iq.in/health || exit 1
