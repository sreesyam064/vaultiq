# VaultIQ — Production Environment (AWS EC2)

# Pulls pre-built images from GHCR (built + pushed by .github/workflows/deploy.yml
# on every push to main) — this file does NOT build images locally. No Ollama —
# uses OpenRouter API. Nginx terminates TLS and is the only service reachable
# from outside the Docker host; backend/frontend are internal-network-only.

# PREREQUISITES (one-time, before first run — see docker-compose.bootstrap.yml):
#   docker volume create certbot-etc
#   docker volume create certbot-webroot
#   A cert must already exist in certbot-etc (obtained via the bootstrap
#   compose file) — nginx below expects one and won't start cleanly without it.

# USAGE (this is what .github/workflows/deploy.yml runs on the VPS, commands below are for manual/local use):
#   Pull      : docker compose -f docker-compose.prod.yml --env-file .env.prod pull
#   Migrate   : docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm backend flask db upgrade
#   Start     : docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#   Stop      : docker compose -f docker-compose.prod.yml down
#   Reset     : docker compose -f docker-compose.prod.yml down -v   (wipes named volumes — NOT certbot-etc/webroot, those are external)
#   Logs      : docker compose -f docker-compose.prod.yml logs -f

# ACCESS (all traffic goes through nginx — backend/frontend have no published
# host ports and are unreachable directly, by design):
#   App          : https://vault-iq.in
#   Health       : https://vault-iq.in/health
#   Health deep  : https://vault-iq.in/health/deep

services:
  backend:
    image: ghcr.io/sreesyam064/vaultiq-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # t4g.medium has 4GB total, shared with frontend + nginx + OS/Docker overhead.
    # 2 gunicorn workers + embedding model (~180MB each) + OS overhead.
    mem_limit: 768m
    expose:
      - "5000"
    env_file:
      - ../.env.prod
    volumes:
      # Single bind mount — matches config.py's STORAGE_URL (/app/storage inside
      # the container), covering uploads/, vector_db/chroma_db/,database/, logs/ all
      # at once. In production STORAGE_BACKEND=r2 so uploads/ and database/
      # stay empty (R2 + Neon are the real stores) — only vector_db/ actually
      # matters here, but mounting the whole tree is simpler and harmless.
      - /mnt/data/storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s # matches the Dockerfile's own start_period — model warmup on boot
    networks:
      - internal

  frontend:
    image: ghcr.io/sreesyam064/vaultiq-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 384m
    expose:
      - "8501"
    env_file:
      - ../.env.prod
    environment:
    # Container-to-container call over the internal Docker network — never touches
    # nginx or the public internet.
      - BACKEND_URL=http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - internal
  
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal 

networks:
  internal:
    driver: bridge

volumes:
  certbot-etc:
    external: true
  certbot-webroot:
    external: true

