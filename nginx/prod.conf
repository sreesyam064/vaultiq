# HTTP — ACME challenge +  redirect everything else to HTTPS
server {
    listen 80;
    server_name vault-iq.in www.vault-iq.in;

    # Required for Let's Encrypt certificate renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Canonical domain is vault-iq.in.
    # Both HTTP hostnames end up at HTTPS on the root domain.
    location / {
        return 301 https://vault-iq.in$request_uri;
    }
}

# HTTPS — redirect www to canonical non-www domain
server {
    listen 443 ssl;
    http2 on;

    server_name www.vault-iq.in;

    # The same Let's Encrypt certificate covers both:
    # vault-iq.in and www.vault-iq.in

    # (Certbot must be run with: -d vault-iq.in -d www.vault-iq.in
    #  so both names land in this one certificate.)
    ssl_certificate     /etc/letsencrypt/live/vault-iq.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vault-iq.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://vault-iq.in$request_uri;
}

# HTTPS — main VaultIQ application
server {
    listen 443 ssl;
    http2 on;

    server_name vault-iq.in;

    ssl_certificate     /etc/letsencrypt/live/vault-iq.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vault-iq.in/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Matches MAX_UPLOAD_SIZE_MB (config.py, default 20MB) -> flask's MAX_CONTENT_LENGTH
    # Nginx has some headroom; the application enforces the real limit.
    client_max_body_size 25m;

    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
    
    # Public backend health endpoint only.
    # Expose backend's own health endpoint for external uptime monitoring (UptimeRobot etc).
    # Read-only, no secrets in response. 
    # The rest of the backend is NOT exposed through Nginx.
    # The frontend container communicates directly with:
    # http://backend:500 over Docker's internal network.
    location = /health {
        proxy_pass http://backend:5000/health;
        proxy_set_header Host $host;
    }

    # Timeout chain, outermost to innermost, already defined by app itself:
    #   this proxy_read_timeout > frontend's ASK_TIMEOUT (420s, frontend/utils/api.py)
    #   > GUNICORN_TIMEOUT (300s default, backend/gunicorn.conf.py)
    # Must exceed ASK_TIMEOUT specifically, not just GUNICORN_TIMEOUT — Streamlit's
    # own client-server wait is true outer bound here.
    location / {
        proxy_pass http://frontend:8501/;

        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 450s;
        proxy_send_timeout 450;
    }

    # Streamlit's websocket stream — long-lived, seperate from ingestion/LLM timeout
    # chain above, needs its own generous timeout.
    location /_stcore/stream {
        proxy_pass http://frontend:8501/_stcore/stream;
        
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        
        proxy_read_timeout 450s;
    }
}